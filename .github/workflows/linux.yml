# Linux で動くかを確かめる。手で起動したときだけ動く（Actions の画面の Run workflow か、gh workflow run linux.yml）
# 止めるときは、Actions の画面でこの workflow を選び、Disable workflow を押す
name: Linux で確かめる

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Claude Code を入れる
        run: npm install -g @anthropic-ai/claude-code

      - name: プラグインの形の検査
        run: claude plugin validate ./session-list

      - name: テスト
        working-directory: session-list
        run: claude plugin test

      # 架空のセッションの記録を作り、同梱の Python を python3 で回す。動いているセッションだけが出ることを見る
      - name: 同梱の Python を python3 で回す
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)"
          mkdir -p "$HOME/.claude/sessions" "$HOME/.claude/projects/-work-space"
          sleep 600 &
          LIVE=$!
          sleep 0 &
          DEAD=$!
          wait "$DEAD"
          NOW=$(date +%s%3N)
          SID=a0000001-0000-4000-8000-000000000001
          GONE=b0000002-0000-4000-8000-000000000002
          echo "{\"pid\": $LIVE, \"sessionId\": \"$SID\", \"name\": \"00-01\", \"status\": \"busy\", \"entrypoint\": \"claude-vscode\", \"cwd\": \"/work/space\", \"updatedAt\": $NOW}" > "$HOME/.claude/sessions/$LIVE.json"
          echo "{\"pid\": $DEAD, \"sessionId\": \"$GONE\", \"name\": \"00-02\", \"status\": \"idle\", \"entrypoint\": \"claude-vscode\", \"cwd\": \"/work/space\", \"updatedAt\": $NOW}" > "$HOME/.claude/sessions/$DEAD.json"
          echo "{\"type\": \"custom-title\", \"customTitle\": \"試験1\", \"sessionId\": \"$SID\"}" > "$HOME/.claude/projects/-work-space/$SID.jsonl"
          python3 -X utf8 session-list/tools/在席表.py | tee attendance.txt
          grep -q "試験1 | a0000001 | 00-01 | 作業中" attendance.txt
          if grep -q b0000002 attendance.txt; then echo "閉じたセッションが出ています"; exit 1; fi
          echo '{}' | python3 -X utf8 session-list/tools/合図表.py - > bells.json
          python3 -c "import json; json.load(open('bells.json', encoding='utf-8')); print('合図表.py の出力は JSON')"
          python3 -X utf8 session-list/tools/様子表.py > activity.json
          python3 -c "import json; ids = [s['id'] for s in json.load(open('activity.json', encoding='utf-8'))['sessions']]; print(ids); assert any(i.startswith('a0000001') for i in ids); assert not any(i.startswith('b0000002') for i in ids)"
          kill "$LIVE"

      - name: マーケットプレイスから入れる
        run: |
          set -euo pipefail
          claude plugin install session-list --marketplace "$GITHUB_WORKSPACE"
          claude plugin list | tee installed.txt
          grep -q session-list installed.txt
